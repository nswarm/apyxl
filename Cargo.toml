[workspace]
resolver = "2"
default-members = [
    "cli",
]
members = [
    "cli",
    "apyxl",
    "csharp"
]

[workspace.dependencies]
apyxl = { path = "apyxl" }
csharp = { path = "csharp" }
anyhow = "1.0"
thiserror = "2.0"
chumsky = "0.12"
ariadne = "0.6"
log = "0.4"
env_logger = "0.11"
itertools = "0.14"
globset = "0.4"
walkdir = "2.3"
dyn-clone = "1.0"
petgraph = { version = "0.8", default-features = false }
lazy_static = "1.4"
tempfile = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
